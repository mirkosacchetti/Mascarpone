[package]
name = "mascarpone"
version = "0.1.0"
edition = "2021"
description = "An mpd client: the library, the playlists, the pictures and words around the music"
license = "MIT"
build = "build.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
mpd_client = "1.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
fuzzy-matcher = "0.3"
libc = "0.2"
fastrand = "2"
bliss-audio = { path = "vendor/bliss-rs", default-features = false, features = ["symphonia-all"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tract-onnx = "0.21"

[profile.release]
opt-level = 2
strip = true
